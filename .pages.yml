media:
  - name: images
    label: Hình ảnh bài viết
    input: content/images/blog
    output: /images/blog
    categories: [image]
    extensions: [jpg, jpeg, png, webp, avif]
    rename: safe

content:
  - name: articles
    label: Bài viết
    type: collection
    path: content/articles
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{slug}.md"
      field: create
    view:
      primary: title
      fields: [title, status, date, category]
      sort: [date, title]
      search: [title, summary, category]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Tiêu đề
        type: string
        required: true
      - name: slug
        label: Đường dẫn (slug)
        type: string
        required: true
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      - name: date
        label: Ngày đăng
        type: date
        required: true
      - name: author
        label: Tác giả
        type: string
        required: true
        options:
          default: Learn Cine
      - name: category
        label: Chuyên mục
        type: select
        required: true
        options:
          values: [Kỹ thuật, Cảm hứng, Chân dung, Hậu kỳ]
      - name: tags
        label: Thẻ
        type: list
        required: false
        field:
          type: string
      - name: summary
        label: Mô tả ngắn
        type: text
        required: true
        options:
          minlength: 20
          maxlength: 500
      - name: cover
        label: Ảnh đại diện
        type: image
        required: true
        options:
          media: images
      - name: cover_alt
        label: Mô tả ảnh đại diện
        type: string
        required: true
      - name: status
        label: Trạng thái
        type: select
        required: true
        options:
          values: [draft, published]
          default: draft
      - name: seo_title
        label: SEO title
        type: string
        required: false
      - name: seo_description
        label: SEO description
        type: text
        required: false
      - name: body
        label: Nội dung bài viết
        type: rich-text
        required: true
        options:
          media: images
          path: .
          rename: safe
          switcher: true

settings:
  hide: true
  commit:
    templates:
      create: "content: create {path}"
      update: "content: update {path}"
      delete: "content: delete {path}"
