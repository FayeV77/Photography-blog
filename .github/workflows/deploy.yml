name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate content and single admin
        run: python scripts/validate_content.py
      - name: Optimize raster images
        run: python scripts/optimize_images.py --write
      - name: Run tests
        run: python -m pytest
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build website
        env:
          SITEURL: ${{ steps.pages.outputs.base_url }}
        run: pelican content -s publishconf.py -o output
      - name: Check generated internal links
        run: python scripts/check_internal_links.py output
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: output
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
