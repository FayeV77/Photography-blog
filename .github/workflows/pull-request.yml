name: Validate pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_content.py --allow-placeholder-admin
      - run: python -m pytest
      - run: pelican content -s pelicanconf.py -o output
      - run: python scripts/check_internal_links.py output
